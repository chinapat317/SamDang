services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro

  certbot:
    build:
      context: ./certbot
    image: local-certbot:v4.0.0-docker-cli
    container_name: certbot
    restart: unless-stopped
    depends_on:
      - nginx
    pid: "service:nginx"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM;
            while :; do
              certbot renew --webroot --webroot-path=/var/www/certbot --quiet --deploy-hook 'kill -HUP 1';
              sleep 12h & wait $${!};
            done"

volumes:
  letsencrypt:
  certbot_www:
