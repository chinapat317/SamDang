services:
  fronthandler:
    build:
      context: .
    container_name: samdang-front-handler
    env_file:
      - ../.env
    environment:
      TZ: Asia/Bangkok
      FRONT_HANDLER_PORT: 8082
    command:
      - /bin/sh
      - -c
      - DB_URL="postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@db:5432/$${POSTGRES_DB}?sslmode=disable" /app/front-handler
    expose:
      - "8082"
    networks:
      - samdang
    restart: unless-stopped

networks:
  samdang:
    external: true
    name: samdang
