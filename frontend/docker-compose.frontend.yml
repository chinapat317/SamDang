services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_LINE_LIFF_ID: ${NEXT_PUBLIC_LINE_LIFF_ID:-2010065177-SzAPAK72}
    container_name: samdang-frontend
    env_file:
      - ../.env
    environment:
      TZ: Asia/Bangkok
      PORT: 8081
      FRONT_HANDLER_INTERNAL_URL: http://samdang-front-handler:8082
    expose:
      - "8081"
    networks:
      - samdang
    restart: unless-stopped

networks:
  samdang:
    external: true
    name: samdang
