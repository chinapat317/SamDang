services:
  db:
    image: postgres:16-alpine
    container_name: db
    env_file:
      - ../.env
    expose:
      - "5432"
    environment:
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    volumes:
      - samdang-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
    restart: unless-stopped

volumes:
  samdang-data:
  
